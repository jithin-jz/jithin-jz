name: Generate Pacman
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Generate light-theme SVG
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: jithin-jz
          games: 'pacman'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate dark-theme SVG via CLI
        run: |
          npm install -g pacman-contribution-graph
          pacman-contribution-graph \
            --game pacman \
            --platform github \
            --username jithin-jz \
            --gameTheme github-dark \
            --output dist/pacman-contribution-graph-dark.svg

      - name: Verify both SVGs exist
        run: |
          ls -la dist/
          test -s dist/pacman-contribution-graph.svg
          test -s dist/pacman-contribution-graph-dark.svg

      - name: Push SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
