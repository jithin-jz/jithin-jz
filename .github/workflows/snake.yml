name: Generate Pacman
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pacman-contribution-graph CLI
        run: npm install -g pacman-contribution-graph

      - name: Generate light theme SVG
        run: mkdir -p dist && pacman-contribution-graph --platform github --username jithin-jz --gameTheme github --output dist/pacman-contribution-graph.svg

      - name: Generate dark theme SVG
        run: pacman-contribution-graph --platform github --username jithin-jz --gameTheme github-dark --output dist/pacman-contribution-graph-dark.svg

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
